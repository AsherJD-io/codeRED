<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 22" fill="none" aria-hidden="true" focusable="false">
  <!--
    Hand-drawn scribble underline for the name heading.
    Two overlapping passes with an irregular, wobbling path so it reads as a
    deliberate pen stroke rather than a straight rule. The second pass sits
    slightly lower and lighter, which is what makes it look like ink rather
    than a drawn line. Placed under "Asher" only.
  -->
  <path
    d="M6 11.5 C 28 6.5, 50 17.5, 74 10 C 96 3.5, 118 17, 142 9.5 C 164 3, 184 12, 196 7.5"
    stroke="currentColor"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M16 15.5 C 40 11.5, 68 20, 98 13.5 C 126 8.5, 154 16.5, 186 11"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>
